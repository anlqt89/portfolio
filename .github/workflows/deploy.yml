name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===== [1/4] Pulling latest code ====="
            cd ~/portfolio
            git fetch origin
            git reset --hard origin/main
            echo "✓ Code updated to $(git rev-parse --short HEAD)"

            echo "===== [2/4] Building frontend ====="
            cd frontend
            npm install
            npx vite build --outDir dist-new
            rm -rf dist && mv dist-new dist
            echo "✓ Frontend build complete"

            echo "===== [3/4] Building backend Docker image ====="
            cd ../backend
            sudo docker build -t portfolio-api-new .
            echo "✓ Docker image built"

            echo "===== [4/4] Swapping containers ====="
            sudo docker stop portfolio-api || true
            sudo docker rm portfolio-api || true
            sudo docker run -d \
              --restart always \
              -p 8000:8000 \
              --name portfolio-api \
              -e FRONTEND_URL=https://anlam.app \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e EMAIL_ADDRESS=${{ secrets.EMAIL_ADDRESS }} \
              -e EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }} \
              portfolio-api-new
            sudo docker rmi portfolio-api || true
            sudo docker tag portfolio-api-new portfolio-api
            echo "✓ Container swapped"

            sudo systemctl reload nginx
            echo "✓ Nginx reloaded"

            echo "===== Health check ====="
            sleep 3
            curl -sf http://localhost:8000/api/projects > /dev/null && echo "✓ Backend OK" || echo "✗ Backend not responding"
            curl -sf http://localhost:80 > /dev/null && echo "✓ Frontend OK" || echo "✗ Frontend not serving"
            sudo docker ps --filter name=portfolio-api --format "Container: {{.Names}} | Status: {{.Status}}"
            echo "===== Deploy complete ====="
