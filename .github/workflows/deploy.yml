name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/portfolio
            git pull origin main

            cd frontend
            npm install
            npm run build

            cd ../backend
            sudo docker build -t portfolio-api .

            sudo docker stop portfolio-api || true
            sudo docker rm portfolio-api || true

            sudo docker run -d \
              -p 8000:8000 \
              --name portfolio-api \
              portfolio-api

            sudo systemctl restart nginx